version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@db:5432/lenny_assistant
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CORS_ALLOW_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lenny_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional convenience service: uncomment if you don't already have Ollama
  # running natively on the host. If you run Ollama natively instead (the
  # documented default path), leave this commented out and just make sure
  # `ollama serve` is running on the host — the backend reaches it via
  # host.docker.internal as configured above.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: lenny_ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

volumes:
  postgres_data:
  # ollama_data:
